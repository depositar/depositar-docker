server {
    listen 80;
    server_name demo.depositar.io;
    return 301 https://$server_name$request_uri;
}

server {
    #listen       80;
    #listen  [::]:80;
    listen       443 ssl;
    listen  [::]:443 ssl;
    server_name  demo.depositar.io;

    client_max_body_size 1024M;

    if ($http_user_agent ~* (Baiduspider)) {
         return 403;
    }

    if ($http_user_agent ~* (Amazonbot)) {
         return 403;
    }

    if ($http_user_agent ~* (meta-externalagent)) {
        return 403;
    }

    access_log /var/log/nginx/demo.depositar.io_access.log;
    error_log /var/log/nginx/demo.depositar.io_error.log error;

    ssl_certificate         /etc/letsencrypt/live/demo/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/demo/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/demo/chain.pem;

    # Load the Diffie-Hellman parameter.
    ssl_dhparam /etc/letsencrypt/dhparams/dhparam.pem;

    # TLS 1.2 & 1.3 only
    ssl_protocols TLSv1.2 TLSv1.3;

    # Disable weak ciphers
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256';

    # SSL sessions
    ssl_session_timeout 30m;
    # ssl_session_cache dfine in stream and http
    ssl_session_tickets off;
    ssl_session_cache shared:SSL:30m;
    # this is the internal Docker DNS, cache only for 30s
    resolver 127.0.0.11 valid=30s;
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_buffer_size 8k;

    # Let nginx start if upstream host is unavailable or down
    set $ckan ckan:5000;

    ##
    # Nginx Bad Bot Blocker Includes
    # REPO: https://github.com/mitchellkrogza/nginx-ultimate-bad-bot-blocker
    ##
    include /etc/nginx/bots.d/ddos.conf; 
    include /etc/nginx/bots.d/blockbots.conf;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/x-javascript
        text/javascript
        text/css
        text/xml
        application/xhtml+xml
        application/xml
        application/atom+xml
        application/rdf+xml
        application/rss+xml
        application/geo+json
        application/json
        application/ld+json
        application/manifest+json
        application/x-web-app-manifest+json
        image/svg+xml
        text/x-cross-domain-policy;
    gzip_static on;  
    gzip_disable "MSIE [1-6]\.";

    # For demo.depositar.io CKAN
    location = / {
        # Setup language prefix
        set $prefix_language $http_accept_language;
        if ($http_accept_language ~* '^(.+?),') {
            set $prefix_language $1;
        }

        # Setup redirect Host
        set $redirect_host $host;
        if ($http_X_Forwarded_Host != '') {
            set $redirect_host $http_X_Forwarded_Host;
        }

        # Setup URL
        set $lang_url $scheme://$redirect_host;

        if ($prefix_language !~* 'zh') {
            return 302 $lang_url/en/;
        }

        proxy_pass http://$ckan$request_uri;
        include /etc/nginx/conf.d/depositar_params;
    }

    location / {
        location /user/login {
            add_header Content-Security-Policy "frame-ancestors 'self'";

            proxy_pass http://$ckan/user/login;
            include /etc/nginx/conf.d/depositar_params;
        }

        proxy_pass http://$ckan$request_uri;
        include /etc/nginx/conf.d/depositar_params;
    }

    error_page 400 401 402 403 404 405 406 407 408 409 410 411 412 413 414 415 416 417 418 421 422 423 424 425 426 428 429 431 451 500 501 502 503 504 505 506 507 508 510 511 /error.html;

    # redirect server error pages to the static page /error.html
    #
    location = /error.html {
      ssi on;
      internal;
      auth_basic off;
      root /usr/share/nginx/html;
    }

}
